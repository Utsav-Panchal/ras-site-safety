[build]
command = "npm run build"
publish = "frontend/dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "20"

[functions]
node_bundler = "esbuild"

# /api/... goes to the Express app running as a Netlify Function
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

# Any other URL opens the React app (so refreshing /admin/submissions works)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200